<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Groblox016 | Mantenimiento</title><style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
    --bg: #050505;
    --text: #f5f5f5;
    --muted: #858585;
    --red: #ff2020;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
}

/* =====================================
   EFECTO VHS
===================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.035;
    background-image:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            white 3px
        );
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    background: radial-gradient(
        circle at center,
        transparent 30%,
        rgba(0,0,0,0.65) 100%
    );
}

/* =====================================
   PANTALLA DE MANTENIMIENTO
===================================== */

.maintenance-screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 30px;

    background: #050505;
}

.maintenance-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* MARTILLO */

.hammer {
    font-size: clamp(70px, 12vw, 120px);
    margin-bottom: 30px;

    animation:
        hammerFloat 3s ease-in-out infinite,
        hammerRotate 4s ease-in-out infinite;

    filter: grayscale(1);
}

/* TÍTULO */

.maintenance-title {
    font-size: clamp(32px, 7vw, 75px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: -3px;

    color: #f5f5f5;

    text-transform: uppercase;

    animation: titlePulse 3s ease-in-out infinite;
}

/* TEXTO */

.maintenance-text {
    margin-top: 25px;

    color: var(--muted);

    font-size: clamp(11px, 2vw, 14px);

    letter-spacing: 4px;

    text-transform: uppercase;
}

/* PEQUEÑO DETALLE */

.maintenance-line {
    width: 45px;
    height: 2px;

    margin-top: 30px;

    background: var(--red);

    box-shadow:
        0 0 10px rgba(255, 32, 32, 0.5);

    animation: linePulse 2s ease-in-out infinite;
}

/* =====================================
   ANIMACIONES
===================================== */

@keyframes hammerFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}

@keyframes hammerRotate {

    0%,
    100% {
        rotate: -5deg;
    }

    50% {
        rotate: 5deg;
    }

}

@keyframes titlePulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.75;
    }

}

@keyframes linePulse {

    0%,
    100% {
        opacity: 0.5;
        transform: scaleX(0.7);
    }

    50% {
        opacity: 1;
        transform: scaleX(1);
    }

}

/* =====================================
   RESPONSIVE
===================================== */

@media (max-width: 600px) {

    .maintenance-title {
        letter-spacing: -1px;
    }

    .maintenance-text {
        letter-spacing: 2px;
        line-height: 1.6;
    }

}

</style></head><body><!-- =====================================
     PANTALLA DE MANTENIMIENTO
===================================== --><div class="maintenance-screen"><div class="maintenance-content">

    <div class="hammer">
        🔨
    </div>

    <h1 class="maintenance-title">
        EN MANTENIMIENTO
    </h1>

    <p class="maintenance-text">
        Estamos realizando algunos cambios
    </p>

    <div class="maintenance-line"></div>

</div>

</div></body>
</html>
