<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Groblox016 | Archivo Oficial</title>

<style>

/* =========================================================
   GROBLOX016 · V4.2
   BASE VISUAL: V1
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
    --bg: #050505;
    --card: #0d0d0d;
    --card2: #111111;
    --text: #f5f5f5;
    --muted: #858585;
    --muted2: #555;
    --line: rgba(255,255,255,0.09);

    --red: #ff2020;
    --red2: #b40000;

    --green: #36ff88;
    --yellow: #ffd000;

    --danger: #ff3030;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', Arial, sans-serif;
    overflow-x: hidden;
}

/* =========================================================
   VHS OVERLAY
   ========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.035;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            white 3px
        );
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;

    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,0.55) 100%
        );
}

/* =========================================================
   NAVEGACIÓN
   ========================================================= */

nav {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 70px;

    z-index: 1000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 6%;

    background: rgba(5,5,5,0.78);
    backdrop-filter: blur(20px);

    border-bottom: 1px solid var(--line);
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: var(--red);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.status {
    font-size: 11px;
    color: var(--green);
    letter-spacing: 1px;
}

.status::before {
    content: "●";
    margin-right: 7px;
}

.language {
    background: #111;
    color: white;

    border: 1px solid var(--line);

    padding: 8px 12px;
    border-radius: 8px;

    cursor: pointer;
}

/* =========================================================
   HERO
   ========================================================= */

.hero {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 100px 20px 60px;

    position: relative;
}

.hero-content {
    max-width: 1000px;
}

.eyebrow {
    color: var(--muted);

    font-size: 12px;
    letter-spacing: 5px;

    margin-bottom: 20px;

    text-transform: uppercase;
}

.end-title {
    font-size: clamp(70px, 15vw, 190px);

    line-height: 0.85;

    font-weight: 900;

    letter-spacing: -8px;

    color: var(--red);

    text-shadow:
        0 0 20px rgba(255,0,0,0.35),
        0 0 70px rgba(255,0,0,0.15);

    animation: pulse 3s infinite ease-in-out;
}

@keyframes pulse {

    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.82;
        transform: scale(1.01);
    }

}

.hero-description {
    margin-top: 30px;

    color: var(--muted);

    font-size: 14px;

    max-width: 600px;

    margin-left: auto;
    margin-right: auto;

    line-height: 1.8;
}

.scroll {
    position: absolute;

    bottom: 30px;

    color: #555;

    font-size: 10px;

    letter-spacing: 3px;
}

/* =========================================================
   CONTENEDOR
   ========================================================= */

.container {
    width: min(1100px, 90%);
    margin: auto;
}

section {
    padding: 100px 0;
}

.section-label {
    color: var(--red);

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 4px;

    margin-bottom: 12px;
}

.section-title {
    font-size: clamp(32px, 5vw, 55px);

    margin-bottom: 50px;

    letter-spacing: -2px;
}

/* =========================================================
   CENTRO DE NOTICIAS
   ========================================================= */

.news-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}

.news-card {
    min-height: 300px;

    padding: 30px;

    background:
        linear-gradient(
            145deg,
            var(--card2),
            var(--card)
        );

    border: 1px solid var(--line);

    border-radius: 20px;

    display: flex;
    flex-direction: column;

    justify-content: space-between;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;

    cursor: pointer;

    position: relative;

    overflow: hidden;
}

.news-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 1px;

    background: var(--red);

    transition: left .4s ease;
}

.news-card:hover::before {
    left: 0;
}

.news-card:hover {
    transform: translateY(-7px);

    border-color:
        rgba(255,0,0,0.35);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.35);
}

.news-card.disabled {
    cursor: not-allowed;

    opacity: .42;
}

.news-card.disabled:hover {
    transform: none;

    border-color: var(--line);

    box-shadow: none;
}

.news-icon {
    font-size: 55px;

    filter: grayscale(1);
}

.news-card h3 {
    font-size: 22px;

    margin-bottom: 8px;
}

.news-card p {
    color: var(--muted);

    font-size: 13px;

    line-height: 1.7;
}

.available {
    color: var(--green) !important;
}

/* =========================================================
   VHS · ARCHIVO
   ========================================================= */

.vhs-wrapper {
    background: #080808;

    border:
        1px solid
        rgba(255,0,0,.13);

    border-radius: 24px;

    overflow: hidden;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.35);
}

.vhs-header {
    padding: 30px;

    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 20px;

    background:
        linear-gradient(
            145deg,
            #111,
            #080808
        );

    border-bottom:
        1px solid
        var(--line);

    cursor: pointer;
}

.vhs-header:hover {
    background:
        linear-gradient(
            145deg,
            #151515,
            #090909
        );
}

.vhs-header-left {
    display: flex;

    align-items: center;

    gap: 20px;
}

.vhs-header-icon {
    font-size: 45px;
}

.vhs-header h3 {
    font-size: 22px;

    margin-bottom: 5px;
}

.vhs-status {
    color: var(--green);

    font-size: 11px;

    letter-spacing: 2px;

    font-weight: 700;
}

.vhs-arrow {
    font-size: 24px;

    color: var(--muted);

    transition: transform .3s ease;
}

.vhs-wrapper.open .vhs-arrow {
    transform: rotate(180deg);
}

.vhs-content {
    display: none;

    padding:
        clamp(25px,5vw,60px);

    line-height: 1.9;

    color: #c5c5c5;

    background:
        radial-gradient(
            circle at top right,
            rgba(255,0,0,.045),
            transparent 35%
        );
}

.vhs-wrapper.open .vhs-content {
    display: block;

    animation:
        openVhs .35s ease;
}

@keyframes openVhs {

    from {
        opacity: 0;
        transform: translateY(-8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.vhs-content strong {
    color: white;
}

.vhs-content p {
    margin-bottom: 20px;
}

.vhs-file {
    margin-top: 35px;

    padding: 25px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background: #050505;

    border-radius: 14px;
}

.vhs-file-title {
    color: var(--red);

    font-size: 11px;

    letter-spacing: 3px;

    margin-bottom: 10px;
}

.close-vhs {
    margin-top: 35px;

    padding: 13px 20px;

    border:
        1px solid
        rgba(255,0,0,.25);

    background: #0d0d0d;

    color: white;

    border-radius: 8px;

    cursor: pointer;

    font-weight: 700;

    transition: .25s;
}

.close-vhs:hover {
    background: var(--red);

    border-color: var(--red);
}

/* =========================================================
   PRÓXIMAMENTE
   ========================================================= */

.locked-section {
    position: relative;
}

.locked-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;
}

.locked-card {
    min-height: 250px;

    padding: 30px;

    position: relative;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #111,
            #080808
        );

    opacity: .72;
}

.locked-icon {
    font-size: 48px;

    filter: grayscale(1);

    opacity: .65;
}

.locked-card h3 {
    margin-top: 30px;

    font-size: 21px;
}

.locked-card p {
    margin-top: 8px;

    color: #666;

    font-size: 13px;
}

.locked-badge {
    position: absolute;

    right: 25px;
    top: 25px;

    padding: 7px 11px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 7px;

    font-size: 9px;

    letter-spacing: 2px;

    color: #777;
}

/* =========================================================
   VIDEOS EN DESARROLLO
   ========================================================= */

.video-list {
    display: flex;

    flex-direction: column;

    gap: 12px;
}

.video-item {
    position: relative;

    min-height: 88px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    padding: 20px 25px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 14px;

    background:
        linear-gradient(
            100deg,
            #0c0c0c,
            #080808
        );

    overflow: hidden;
}

.video-item::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 4px,
            rgba(255,255,255,.012) 5px
        );

    pointer-events: none;
}

.video-info {
    min-width: 0;
}

.video-status {
    display: block;

    font-size: 9px;

    letter-spacing: 2px;

    margin-bottom: 8px;
}

.video-status.available {
    color: var(--green);
}

.video-status.soon {
    color: var(--yellow);
}

.video-status.locked {
    color: var(--red);
}

.video-name {
    font-size: 14px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.video-name.blur {
    filter: blur(5px);

    user-select: none;

    opacity: .6;
}

.video-lock {
    flex-shrink: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 5px;

    color: #666;

    font-size: 9px;

    letter-spacing: 2px;

    font-weight: 700;
}

.video-lock-icon {
    font-size: 25px;

    filter: grayscale(1);
}

/* =========================================================
   RECOMENDACIONES
   ========================================================= */

.rating {
    text-align: center;
}

.stars {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin: 30px 0;
}

.star {
    font-size: 45px;

    color: #333;

    cursor: pointer;

    transition: .2s;

    user-select: none;
}

.star:hover {
    color: #ffd000;

    transform: scale(1.15);
}

.star.active {
    color: #ffd000;

    text-shadow:
        0 0 15px
        rgba(255,208,0,.25);
}

.review-box {
    max-width: 600px;

    margin: auto;

    background: #0d0d0d;

    border:
        1px solid
        var(--line);

    padding: 30px;

    border-radius: 20px;

    text-align: left;
}

.review-rating {
    text-align: center;

    color: #777;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 15px;
}

.review-box textarea {
    width: 100%;

    height: 120px;

    resize: vertical;

    min-height: 100px;
    max-height: 250px;

    background: #050505;

    border:
        1px solid
        var(--line);

    color: white;

    padding: 15px;

    border-radius: 10px;

    margin-bottom: 15px;

    font-family: inherit;

    outline: none;

    transition: border-color .2s;
}

.review-box textarea:focus {
    border-color:
        rgba(255,0,0,.45);
}

.review-box textarea::placeholder {
    color: #555;
}

.review-box button {
    width: 100%;

    padding: 14px;

    background: white;

    color: black;

    border: none;

    border-radius: 8px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.review-box button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(255,255,255,.08);
}

.review-box button:active {
    transform: translateY(0);
}

.review-result {
    display: none;

    margin-top: 15px;

    padding: 14px;

    border-radius: 10px;

    background:
        rgba(54,255,136,.05);

    border:
        1px solid
        rgba(54,255,136,.16);

    color: var(--green);

    font-size: 12px;

    text-align: center;

    line-height: 1.6;
}

/* =========================================================
   MENSAJE FLOTANTE
   ========================================================= */

.message-button {
    position: fixed;

    right: 25px;
    bottom: 25px;

    width: 60px;
    height: 60px;

    border-radius: 50%;

    border: none;

    background: white;

    color: black;

    font-size: 25px;

    cursor: pointer;

    z-index: 2000;

    animation:
        float 2.5s infinite ease-in-out;

    box-shadow:
        0 0 30px
        rgba(255,255,255,.15);
}

@keyframes float {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }

}

.message-button.stop {
    animation: none;
}

.welcome {
    position: fixed;

    right: 25px;
    bottom: 100px;

    width:
        min(370px,
        calc(100% - 50px));

    background:
        rgba(15,15,15,.97);

    border:
        1px solid
        var(--line);

    padding: 25px;

    border-radius: 20px;

    z-index: 1999;

    display: none;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.6);
}

.welcome.show {
    display: block;

    animation:
        popup .22s ease;
}

@keyframes popup {

    from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

.welcome h3 {
    margin-bottom: 15px;
}

.welcome p {
    color: #aaa;

    font-size: 13px;

    line-height: 1.8;
}

.welcome-action {
    margin-top: 20px;

    width: 100%;

    padding: 13px;

    border: 1px solid var(--line);

    background: #111;

    color: white;

    border-radius: 9px;

    cursor: pointer;

    font-weight: 700;

    transition: .2s;
}

.welcome-action:hover {
    border-color:
        rgba(255,0,0,.4);

    background: #151515;
}

/* =========================================================
   DIAGNÓSTICO
   ========================================================= */

.js-status {
    position: fixed;

    left: 15px;
    bottom: 15px;

    z-index: 1500;

    padding: 7px 10px;

    border-radius: 7px;

    background: rgba(10,10,10,.85);

    border:
        1px solid
        rgba(54,255,136,.15);

    color: #555;

    font-size: 8px;

    letter-spacing: 1px;

    pointer-events: none;

    opacity: .65;
}

.js-status.error {
    color: var(--red);

    border-color:
        rgba(255,0,0,.3);
}

/* =========================================================
   FOOTER
   ========================================================= */

footer {
    text-align: center;

    padding: 60px 20px;

    border-top:
        1px solid
        var(--line);

    color: #555;

    font-size: 12px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:800px) {

    nav {
        padding: 0 20px;
    }

    .status {
        display: none;
    }

    .news-grid {
        grid-template-columns: 1fr;
    }

    .locked-grid {
        grid-template-columns: 1fr;
    }

    .video-item {
        align-items: flex-start;
    }

    .video-name {
        white-space: normal;
    }

    .end-title {
        letter-spacing: -4px;
    }

}

@media(max-width:450px) {

    .language {
        font-size: 11px;
    }

    .logo {
        font-size: 17px;
    }

    .vhs-header {
        padding: 22px;
    }

    .vhs-header-icon {
        font-size: 35px;
    }

    .vhs-header h3 {
        font-size: 18px;
    }

    .star {
        font-size: 36px;
    }

    .stars {
        gap: 5px;
    }

    .message-button {
        right: 18px;
        bottom: 18px;

        width: 55px;
        height: 55px;
    }

    .welcome {
        right: 18px;
        bottom: 85px;

        width:
            calc(100% - 36px);
    }

}

</style>
</head>

<body>

<!-- =======================================================
     NAVEGACIÓN
     ======================================================= -->

<nav>

    <div class="logo">
        GROBLOX<span>016</span>
    </div>

    <div class="nav-right">

        <div class="status">
            ONLINE
        </div>

        <select
            class="language"
            id="language"
            aria-label="Idioma"
        >

            <option value="es">

            </option>

            <option value="en">
                EN (EN DESARROLLO)
            </option>

        </select>

    </div>

</nav>


<!-- =======================================================
     HERO
     ======================================================= -->

<header class="hero">

    <div class="hero-content">

        <div class="eyebrow">
            ARCHIVO OFICIAL · PROYECTO VHS
        </div>

        <h1 class="end-title">
            GROBLOX016
        </h1>

        <p class="hero-description">
            Archivo oficial de información, proyectos,
            vídeos y contenido relacionado con
            Groblox016.
        </p>

    </div>

    <div class="scroll">
        DESLIZA PARA CONTINUAR
    </div>

</header>


<!-- =======================================================
     CENTRO DE NOTICIAS
     ======================================================= -->

    <div class="news-grid">

            <div>

                <h3>

                <p class="available">

        </div>


        <!-- PRÓXIMAMENTE 1 -->

                ❔
            </div>

            <div>

                <h3>
                    Próximamente
                </h3>

                <p>
                    🔒 Sección bloqueada.
                </p>

            </div>

        </div>


        <!-- PRÓXIMAMENTE 2 -->

        <div class="news-card disabled">

            <div class="news-i
